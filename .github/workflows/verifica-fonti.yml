name: Verifica fonti

on:
  workflow_dispatch:
    inputs:
      solo:
        description: "Lascia vuoto per tutto, oppure: foto, live, loghi, ricerca, tennislive, cache, nazionali, ht"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Diagnostica di rete
        if: github.event.inputs.solo == ''
        run: python -m pipeline.diagnose

      - name: Controlla cosa restituisce ogni fonte
        run: python -m pipeline.check_sources ${{ github.event.inputs.solo }}

      - name: Salva il resoconto
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/
          git diff --cached --quiet || git commit -m "Resoconto verifica fonti"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
