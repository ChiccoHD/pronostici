name: Aggiorna dati

on:
  schedule:
    # Sei volte al giorno. Orari in UTC: in Italia +1 ora d'inverno, +2 d'estate
    # (inverno: 7:17, 10:47, 13:47, 16:47, 19:47, 23:17). Minuti "strani" perché
    # allo scoccare dell'ora GitHub è più congestionato e ritarda di più.
    - cron: "17 6 * * *"
    - cron: "47 9 * * *"
    - cron: "47 12 * * *"
    - cron: "47 15 * * *"
    - cron: "47 18 * * *"
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      solo:
        description: "Sport da aggiornare (calcio,coppe,nazionali,nba,tennis,f1)"
        required: false
        default: "calcio,coppe,nazionali,nba,tennis,f1"

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scarica dati e calcola le percentuali
        run: python -m pipeline.run --solo "${{ github.event.inputs.solo || 'calcio,coppe,nazionali,nba,tennis,f1' }}"

      - name: Riepilogo
        if: always()
        run: |
          echo '### Stato fonti' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat public/data/meta.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Salva i dati nel repository
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/cache report/controllo.md
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi
          git commit -m "Dati aggiornati $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done
